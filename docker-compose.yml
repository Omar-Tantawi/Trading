services:
  db:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: tb-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: tb
      POSTGRES_PASSWORD: tb_local_dev
      POSTGRES_DB: trading_buddy
    ports:
      - "5432:5432"
    volumes:
      - tb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb -d trading_buddy"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_wal_size=4GB
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB

volumes:
  tb_pgdata:
