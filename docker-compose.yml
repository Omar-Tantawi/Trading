services:
  db:
    image: timescale/timescaledb:2.30.1-pg16
    container_name: tb-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: tb
      # Set POSTGRES_PASSWORD in the environment (or .env) BEFORE the first
      # start on any other machine. The default only matches the volume
      # this dev machine was initialised with; an existing volume keeps its
      # original password whatever this says.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tb_local_dev}
      POSTGRES_DB: trading_buddy
    ports:
      # Loopback only. On a VPS, Docker-published ports bypass ufw, so a
      # plain "5433:5432" would expose the database to the internet.
      - "127.0.0.1:5433:5432"
    volumes:
      - tb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tb -d trading_buddy"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_wal_size=4GB
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB

volumes:
  tb_pgdata:
